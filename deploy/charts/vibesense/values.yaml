# VibeSense chart. Argo CD deploys it (deploy/apps/, Task 6.3); render it
# locally with:
#   helm template vibesense deploy/charts/vibesense -n vibesense \
#     --set registry=example.dkr.ecr.us-east-1.amazonaws.com \
#     --set images.app.tag=dev --set images.ai.tag=dev \
#     --set ingress.allowedCidrs=203.0.113.7/32

# The ECR registry, <account>.dkr.ecr.us-east-1.amazonaws.com. Not set here on
# purpose: Argo CD fills it in from the cluster's metadata (Task 6.3), so the
# AWS account ID never lands in git.
registry: ""

# The AWS account, for SQS queue URLs in the KEDA triggers. Set by Argo CD the
# same way as `registry`.
awsAccountId: ""
awsRegion: us-east-1

images:
  app:
    repository: vibesense-app
    tag: 60f7b3cd6648 # the commit the image was built from; CI updates it (Phase 7)
  ai:
    repository: vibesense-ai
    tag: 60f7b3cd6648

# Plain settings every workload gets. A workload's own `env` wins on a clash.
env:
  AWS_REGION: us-east-1
  LOG_FORMAT: json

# Where each secret env var comes from: a Kubernetes Secret written by the
# ExternalSecrets in templates/external-secrets.yaml. A workload lists only the
# names it needs (`secretEnv`), so e.g. the AI worker never sees the database
# password or the SMTP password.
secretEnv:
  DB_URL: { secret: vibesense-database, key: DB_URL }
  YOUTUBE_API_KEY: { secret: vibesense-app-secrets, key: YOUTUBE_API_KEY }
  SMTP_USER: { secret: vibesense-app-secrets, key: SMTP_USER }
  SMTP_PASS: { secret: vibesense-app-secrets, key: SMTP_PASS }
  SCHEDULER_ROLE_ARN: { secret: vibesense-platform, key: SCHEDULER_ROLE_ARN }
  INGEST_QUEUE_ARN: { secret: vibesense-platform, key: INGEST_QUEUE_ARN }

externalSecrets:
  refreshInterval: 1h
  parameterStore: aws-parameter-store # ClusterSecretStores (deploy/cluster-config/)
  secretsManager: aws-secrets-manager

# Queue workers. The map key is the Deployment name AND the ServiceAccount
# name, which must match a Pod Identity association (infra/platform/workload-roles.tf).
#
# Resources: memory requests and limits on everything, CPU requests only. A CPU
# limit throttles a pod even when the node has idle CPU; memory can't be
# shared that way, so it gets a hard cap. Sized from `kubectl top` during a demo
# job (docs/measurements.md): requests a little above what was measured, limits
# with room for a large video. Re-check under load with Prometheus (Phase 9).
workers:
  ingestion:
    image: app
    command: ["python", "-m", "src.ingestion_service.app"]
    secretEnv: [DB_URL, YOUTUBE_API_KEY]
    autoscaling: { queue: ingest, minReplicas: 1, maxReplicas: 3, queueLength: 2 }
    resources:
      requests: { cpu: 100m, memory: 256Mi } # measured 170Mi
      limits: { memory: 512Mi } # holds a video's comments in memory
  ai:
    image: ai # the image's own CMD starts the AI worker
    secretEnv: [] # no database, no SMTP: it only reads and writes queues
    # Scale to zero when idle: the model's memory is only paid for while there
    # are comments to score.
    autoscaling: { queue: analysis, minReplicas: 0, maxReplicas: 6, queueLength: 5 }
    # Only on Karpenter's burst nodes (deploy/cluster-config/karpenter.yaml):
    # scaling the AI worker from zero adds a node, and back to zero removes it.
    nodeSelector: { vibesense/node-role: burst }
    tolerations:
      - { key: vibesense/burst, operator: Exists, effect: NoSchedule }
    startupSeconds: 180 # loads the model before serving probes
    resources:
      requests: { cpu: 500m, memory: 768Mi } # measured 390Mi with the model loaded
      limits: { memory: 1536Mi } # scoring a large batch needs headroom
  aggregation:
    image: app
    command: ["python", "-m", "src.aggregation_service.app"]
    secretEnv: [DB_URL]
    autoscaling: { queue: aggregation, minReplicas: 1, maxReplicas: 3, queueLength: 10 }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }
  notification:
    image: app
    command: ["python", "-m", "src.notification_service.app"]
    env:
      SMTP_SERVER: smtp.gmail.com
      SMTP_PORT: "587"
      SUPPRESS_EMAIL_DOMAINS: example.com # load-test jobs (src/load_test.py)
    secretEnv: [DB_URL, SMTP_USER, SMTP_PASS]
    autoscaling: { queue: notification, minReplicas: 1, maxReplicas: 3, queueLength: 10 }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }

# Defaults for every worker; a worker can override replicas or startupSeconds.
workerDefaults:
  replicas: 1 # only for a worker without `autoscaling`
  metricsPort: 9000 # /healthz, /readyz, /metrics (src/common/worker.py)
  startupSeconds: 120

ui:
  # One replica on purpose: Streamlit keeps each session on one pod over a
  # WebSocket (Task 6.2).
  replicas: 1
  port: 8501
  env:
    DEMO_MODE: "true" # adds the 30-minute demo plan
  secretEnv: [DB_URL, YOUTUBE_API_KEY, SCHEDULER_ROLE_ARN, INGEST_QUEUE_ARN]
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

ingress:
  enabled: true
  # Comma-separated CIDRs allowed to reach the ALB. Required: the UI creates
  # jobs that call the YouTube API and send email, so it isn't left open to the
  # internet. Argo CD fills it in from the cluster's metadata (Task 6.3).
  allowedCidrs: ""

# Prometheus scraping of the workers' /metrics (templates/pod-monitor.yaml).
# Needs the PodMonitor type from kube-prometheus-stack (deploy/apps/monitoring.yaml).
metrics:
  podMonitor: true

# Incoming traffic: deny by default, then allow the UI's port and Prometheus
# scraping the workers (templates/network-policies.yaml). Kubelet health
# probes come from the node's own IP, which the VPC CNI's policy agent allows;
# the Task 6.5 test confirms pods stay Ready.
networkPolicy:
  enabled: true
  prometheus:
    namespace: monitoring # kube-prometheus-stack (Phase 9)

# KEDA scales each worker that has an `autoscaling` block on its queue's depth:
# desired replicas = (visible + in-flight messages) / queueLength, between
# minReplicas and maxReplicas (templates/scaled-objects.yaml). Queue depth, not
# CPU: a worker waiting on I/O shows low CPU while its backlog grows.
autoscaling:
  pollingInterval: 10 # seconds between queue checks; low for a snappy demo
  cooldownPeriod: 120 # idle seconds before scaling to zero (AI worker)

migration:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
