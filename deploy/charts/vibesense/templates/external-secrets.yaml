{{- /*
Kubernetes Secrets, copied from AWS by External Secrets Operator. Sync wave -1:
Argo CD waits until they're synced before running the migration (wave 0) and
starting pods (wave 1), so nothing starts without its config.
*/ -}}
{{- $es := .Values.externalSecrets }}
# The database URL, built from the platform settings in Parameter Store and the
# RDS-managed master secret, whose name is random (rds!db-<id>), so it's found
# by pattern. The password is URL-encoded: RDS passwords can contain ':', '#'
# or '%', which would otherwise break the URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vibesense-database
  labels:
    {{- include "vibesense.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.parameterStore }}
  target:
    name: vibesense-database
    template:
      engineVersion: v2
      data:
        # sslmode=require: encrypted to RDS. verify-full would also check the
        # server certificate, but needs the RDS CA bundle in the image.
        DB_URL: {{ `postgresql://{{ (.rds_master | fromJson).username | urlquery }}:{{ (.rds_master | fromJson).password | urlquery }}@{{ .db_host }}:{{ .db_port }}/{{ .db_name }}?sslmode=require` | quote }}
  data:
    - secretKey: db_host
      remoteRef:
        key: /vibesense/platform/db_host
    - secretKey: db_port
      remoteRef:
        key: /vibesense/platform/db_port
    - secretKey: db_name
      remoteRef:
        key: /vibesense/platform/db_name
  dataFrom:
    - sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: {{ $es.secretsManager }}
      find:
        name:
          regexp: "^rds!db-"
      rewrite:
        - regexp:
            source: "^rds!db-.*$"
            target: rds_master
---
# App secrets, put in Parameter Store by `make secrets` (never by Terraform).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vibesense-app-secrets
  labels:
    {{- include "vibesense.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.parameterStore }}
  target:
    name: vibesense-app-secrets
  data:
    - secretKey: YOUTUBE_API_KEY
      remoteRef:
        key: /vibesense/secrets/youtube_api_key
    - secretKey: SMTP_USER
      remoteRef:
        key: /vibesense/secrets/smtp_user
    - secretKey: SMTP_PASS
      remoteRef:
        key: /vibesense/secrets/smtp_pass
---
# Terraform outputs the UI needs to create EventBridge schedules. Not secret,
# but they come from the same place, so one mechanism handles both.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vibesense-platform
  labels:
    {{- include "vibesense.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.parameterStore }}
  target:
    name: vibesense-platform
  data:
    - secretKey: SCHEDULER_ROLE_ARN
      remoteRef:
        key: /vibesense/platform/scheduler_role_arn
    - secretKey: INGEST_QUEUE_ARN
      remoteRef:
        key: /vibesense/platform/ingest_queue_arn
