{{- if .Values.networkPolicy.enabled }}
{{- /*
Incoming traffic to VibeSense pods. Enforced by the VPC CNI's network policy
agent (enableNetworkPolicy on the vpc-cni add-on, infra/platform/eks.tf).
Policies only add allows, so: deny everything, then open what's needed.
*/ -}}
# 1. Nothing reaches any pod in this namespace unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "vibesense.labels" . | nindent 4 }}
spec:
  podSelector: {} # every pod in the namespace
  policyTypes: ["Ingress"]
  # Egress is left open on purpose: the workers call AWS APIs, YouTube and Gmail
  # SMTP, and a NetworkPolicy can only filter by IP, not by domain name. See
  # the chart README.
---
# 2. The UI, from the ALB. Who may reach the ALB is set by its security group
# (ingress.allowedCidrs), so any source is allowed on the UI's port here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui
  labels:
    {{- include "vibesense.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vibesense.selectorLabels" (dict "component" "ui") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: {{ .Values.ui.port }}
          protocol: TCP
---
# 3. Worker metrics (/metrics on the probe port), from Prometheus only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  labels:
    {{- include "vibesense.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          {{- range $name, $_ := .Values.workers }}
          - {{ $name }}
          {{- end }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheus.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: {{ .Values.workerDefaults.metricsPort }}
          protocol: TCP
{{- end }}
