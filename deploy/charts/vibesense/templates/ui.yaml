{{- $ui := .Values.ui }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui # must match its Pod Identity association
  labels:
    {{- include "vibesense.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    {{- include "vibesense.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ $ui.replicas }}
  selector:
    matchLabels:
      {{- include "vibesense.selectorLabels" (dict "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vibesense.selectorLabels" (dict "component" "ui") | nindent 8 }}
    spec:
      serviceAccountName: ui
      securityContext:
        {{- include "vibesense.podSecurityContext" . | nindent 8 }}
      containers:
        - name: ui
          image: {{ include "vibesense.image" (dict "root" $ "image" "app") }}
          command:
            - streamlit
            - run
            - src/ui_service/app.py
            - --server.address=0.0.0.0
            - --server.port={{ $ui.port }}
            - --server.headless=true
          ports:
            - name: http
              containerPort: {{ $ui.port }}
          env:
            {{- include "vibesense.env" (dict "root" $ "env" $ui.env "secretEnv" $ui.secretEnv) | nindent 12 }}
          startupProbe:
            httpGet: { path: /_stcore/health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /_stcore/health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /_stcore/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml $ui.resources | nindent 12 }}
          securityContext:
            {{- include "vibesense.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    {{- include "vibesense.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    {{- include "vibesense.selectorLabels" (dict "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.ingress.enabled }}
---
# An internet-facing ALB, created by the AWS Load Balancer Controller. Plain
# HTTP on the ALB's own DNS name: no domain, so no certificate. That's why
# access is limited to allowedCidrs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ui
  labels:
    {{- include "vibesense.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip # straight to the pod IP (VPC CNI)
    alb.ingress.kubernetes.io/healthcheck-path: /_stcore/health
    alb.ingress.kubernetes.io/inbound-cidrs: {{ required "ingress.allowedCidrs is required (Argo CD sets it; see docs/adr/0016-gitops-bridge.md)" .Values.ingress.allowedCidrs | quote }}
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  name: http
{{- end }}
