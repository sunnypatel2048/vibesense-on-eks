# Where External Secrets reads from. No credentials here: the operator uses its
# Pod Identity role, which allows /vibesense/secrets/*, /vibesense/platform/*
# and the RDS-managed password (infra/platform/workload-roles.tf).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
