# What Karpenter may launch. Applied by cluster-config (wave 2), after the
# Karpenter app (wave 1) has installed these types.
#
# The "burst" pool is for the AI worker only: tainted, so nothing else lands
# there, and consolidated away as soon as the AI pods are gone. Everything else
# runs on the two system nodes.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: vibesense-karpenter-node # Terraform: module.karpenter node_iam_role_name
  # Latest Amazon Linux 2023 EKS AMI. A new release replaces nodes (drift), which
  # is fine for short-lived burst nodes; production would pin a version.
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: vibesense
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: vibesense
  # Pods can't reach the instance metadata service (hop limit 1): they get AWS
  # credentials only through Pod Identity, never the node's role.
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 1
  tags:
    Project: vibesense # found by scripts/leftovers.sh
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: burst
spec:
  template:
    metadata:
      labels:
        vibesense/node-role: burst
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
        - key: vibesense/burst
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"] # Graviton: the images are arm64, and it's cheaper
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["t4g", "m7g", "c7g"] # several families: Spot rarely runs out of all
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large", "xlarge"]
      expireAfter: 24h
  # A ceiling on what Karpenter can spend: 16 vCPUs in total across this pool.
  limits:
    cpu: "16"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
