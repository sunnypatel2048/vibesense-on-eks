# Smoke test for External Secrets. Applied by hand, never by Argo CD.
#   kubectl apply -f deploy/smoke/external-secrets-check.yaml
#   kubectl -n smoke get externalsecrets            # both: SecretSynced
#   kubectl -n smoke get secret platform-config -o json | jq '.data | keys'
#   kubectl -n smoke get secret database -o json | jq '.data | keys'
#   kubectl delete -f deploy/smoke/external-secrets-check.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: smoke
---
# Plain lookups by name from Parameter Store: platform config + one app secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-config
  namespace: smoke
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: platform-config
  data:
    - secretKey: db_host
      remoteRef:
        key: /vibesense/platform/db_host
    - secretKey: youtube_api_key
      remoteRef:
        key: /vibesense/secrets/youtube_api_key
---
# The RDS-managed secret has a random name (rds!db-<id>): find it by pattern and
# rewrite its key to a fixed name. Its value is JSON {"username": ..., "password": ...}.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database
  namespace: smoke
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: database
  dataFrom:
    - find:
        name:
          regexp: "^rds!db-"
      rewrite:
        - regexp:
            source: "^rds!db-.*$"
            target: rds_master
