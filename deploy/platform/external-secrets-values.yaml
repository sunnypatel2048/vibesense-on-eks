# Helm values for External Secrets Operator (deploy/apps/external-secrets.yaml).
# Copies values from SSM Parameter Store and Secrets Manager into Kubernetes
# Secrets, authenticating with its own Pod Identity role (Terraform).

serviceAccount:
  name: external-secrets # matches the Pod Identity association

nodeSelector:
  vibesense/node-role: system

webhook:
  nodeSelector:
    vibesense/node-role: system

certController:
  nodeSelector:
    vibesense/node-role: system
