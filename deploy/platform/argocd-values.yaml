# Helm values for Argo CD (chart argo/argo-cd), installed by scripts/bootstrap-argocd.sh.

global:
  # Platform components stay on the stable system nodes, not Karpenter's
  # short-lived burst nodes (Phase 8).
  nodeSelector:
    vibesense/node-role: system

# One user: no SSO. Fewer pods on two small nodes.
dex:
  enabled: false

notifications:
  enabled: false

server:
  # UI only through `kubectl port-forward`; no load balancer, no public URL.
  service:
    type: ClusterIP

configs:
  cm:
    # How often Argo CD checks Git for changes (default 3m). Shorter keeps
    # demos snappy; a webhook from GitHub would make it instant.
    timeout.reconciliation: 60s

    # Report each child Application's own health. Argo CD stopped assessing
    # Application health in v1.8; without this, sync waves in the root app don't
    # wait for a wave to be healthy before starting the next. Recommended by the
    # Argo CD docs for app-of-apps with sync waves.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
