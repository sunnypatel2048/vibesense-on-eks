# The Prometheus Operator's resource types (ServiceMonitor, PodMonitor,
# PrometheusRule, ...), installed on their own in wave -1.
#
# Why not let kube-prometheus-stack install them (wave 2): KEDA (wave 0) and
# Karpenter (wave 1) create ServiceMonitors/PodMonitors. Without the types,
# those apps can't sync, wave 0 never turns Healthy, and wave 2 never starts.
# Keep this chart's operator version in step with kube-prometheus-stack's.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 33.0.2 # operator v0.95.2, same as kube-prometheus-stack 93.3.0
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false # never delete CRDs automatically: that deletes every object of that type
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # these CRDs are too large for client-side apply
