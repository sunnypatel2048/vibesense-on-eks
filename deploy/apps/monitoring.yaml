# Prometheus, Grafana and Alertmanager (kube-prometheus-stack), plus this repo's
# monitoring objects in deploy/monitoring/ (rendered with Kustomize): Grafana's
# admin secret and the dashboards, and later the SLO alert.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2" # after cert-manager (0), whose Certificates the operator's webhook uses
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.3.0 # exact; bump deliberately
      helm:
        releaseName: monitoring # shorter resource names than the chart's own
        valueFiles:
          - $values/deploy/platform/monitoring-values.yaml
    - repoURL: https://github.com/sunnypatel2048/vibesense-on-eks.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/sunnypatel2048/vibesense-on-eks.git
      targetRevision: main
      path: deploy/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring # the vibesense network policy allows scrapes from here
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # The operator's admission webhook certificate comes from cert-manager, whose
  # cainjector writes the CA into the webhook configurations at runtime.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
