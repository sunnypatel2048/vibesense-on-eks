# Turns Ingresses into ALBs. Its IAM role (Terraform) uses the official policy for
# this exact version: infra/platform/policies/aws-load-balancer-controller.json.
# Upgrade both together.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: 3.6.3 # controller v3.6.3; matches the IAM policy file
      helm:
        valueFiles:
          - $values/deploy/platform/aws-load-balancer-controller-values.yaml
    - repoURL: https://github.com/sunnypatel2048/vibesense-on-eks.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true # apply ignoreDifferences to syncs, not just diffs
  # Without cert-manager, the chart generates a new self-signed CA and webhook
  # certificate on every render, and Argo CD re-renders on every refresh. The
  # webhooks' caBundle then keeps changing while the controller still serves the
  # old certificate, and Kubernetes rejects Ingresses ("x509: certificate signed
  # by unknown authority"). Create them once, then leave them alone.
  # Production alternative: cert-manager with enableCertManager: true.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: ""
      kind: Secret
      name: aws-load-balancer-tls
      namespace: kube-system
      jsonPointers:
        - /data
