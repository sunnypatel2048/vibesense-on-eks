# Turns Ingresses into ALBs. Its IAM role (Terraform) uses the official policy for
# this exact version: infra/platform/policies/aws-load-balancer-controller.json.
# Upgrade both together.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # needs cert-manager's CRDs (wave 0)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: 3.6.3 # controller v3.6.3; matches the IAM policy file
      helm:
        valueFiles:
          - $values/deploy/platform/aws-load-balancer-controller-values.yaml
    - repoURL: https://github.com/sunnypatel2048/vibesense-on-eks.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true # apply ignoreDifferences to syncs, not just diffs
  # The webhook certificate comes from cert-manager (enableCertManager in the
  # values file), and cert-manager's cainjector writes its CA into the webhook
  # configurations at runtime. Don't treat that as drift.
  #
  # History: without cert-manager the chart generates a new CA and certificate
  # on every render. Ignoring those fields kept a running cluster stable, but on
  # a fresh install the Secret and the webhooks could still come from different
  # renders, and every Ingress was rejected ("x509: certificate signed by
  # unknown authority"). Certificates made at runtime can't drift from git.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
