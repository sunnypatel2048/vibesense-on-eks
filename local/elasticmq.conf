# Local stand-in for the SQS queues Terraform creates in AWS (Task 4.5).
# Same names, same DLQ rule: a message that fails 5 receives moves to <queue>-dlq.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"          # build queue URLs from the request's Host header,
  port = 9324         # so they work from the host and from other containers
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = relaxed
}

queues {
  vibesense-ingest {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "vibesense-ingest-dlq"
      maxReceiveCount = 5
    }
  }
  vibesense-ingest-dlq {}
  vibesense-analysis {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "vibesense-analysis-dlq"
      maxReceiveCount = 5
    }
  }
  vibesense-analysis-dlq {}
  vibesense-aggregation {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "vibesense-aggregation-dlq"
      maxReceiveCount = 5
    }
  }
  vibesense-aggregation-dlq {}
  vibesense-notification {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "vibesense-notification-dlq"
      maxReceiveCount = 5
    }
  }
  vibesense-notification-dlq {}
}
