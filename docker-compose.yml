services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: vibesense
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  elasticmq:  # Local SQS
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"  # SQS API
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  postgres_data: